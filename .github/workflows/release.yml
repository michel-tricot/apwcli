name: Release

# Publishes apwlib and apwcli to PyPI (in lockstep) when a v* tag is pushed,
# then creates the GitHub release. Uses PyPI Trusted Publishing (OIDC), so no
# API token is stored; configure a trusted publisher for BOTH project names
# first (see the Releasing notes in AGENTS.md).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check lockstep versions match the tag
        run: |
          uv run --no-project python - <<'PY'
          import os, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          cli = tomllib.load(open("pyproject.toml", "rb"))["project"]
          lib = tomllib.load(open("packages/apwlib/pyproject.toml", "rb"))["project"]
          pin = next(d for d in cli["dependencies"] if d.startswith("apwlib"))
          problems = []
          if f"v{cli['version']}" != tag:
              problems.append(f"apwcli {cli['version']} != {tag}")
          if lib["version"] != cli["version"]:
              problems.append(f"apwlib {lib['version']} != apwcli {cli['version']}")
          if pin != f"apwlib=={cli['version']}":
              problems.append(f"pin {pin!r} != apwlib=={cli['version']}")
          if problems:
              sys.exit("; ".join(problems))
          print(f"lockstep ok: {cli['version']}")
          PY

      - name: Build both packages
        run: uv build --all-packages

      - name: Publish apwlib and apwcli to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub release
        # Skip if it already exists so a rerun of a partially-failed job can
        # proceed to the tap step instead of dying here.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_PUSH_TOKEN secret is not set; tap not updated"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum "dist/apwcli-$VERSION.tar.gz" | cut -d' ' -f1)
          # PyPI needs a moment before the just-published sdist shows up in its JSON.
          URL=""
          for _ in $(seq 1 30); do
            URL=$(curl -fsSL "https://pypi.org/pypi/apwcli/$VERSION/json" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(u['url'] for u in d['urls'] if u['packagetype']=='sdist'))") && break
            sleep 5
          done
          [ -n "$URL" ] || { echo "::error::sdist for $VERSION never appeared on PyPI"; exit 1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/michel-tricot/homebrew-tap.git" tap
          cd tap
          sed -i -E "s|^  url \".*\"|  url \"$URL\"|" Formula/apwcli.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/apwcli.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "apwcli $VERSION"
          git push
