name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Format, lint, typecheck, tests, docs examples
        run: scripts/check.sh

      - name: CLI smoke test
        run: |
          uv run apwcli --help
          uv run apwcli --version
          # No Apple Passwords helper on CI runners; the guard must exit cleanly (code 1,
          # "requires macOS"), not traceback.
          uv run apwcli pw list github.com && exit 1 || test $? -eq 1
