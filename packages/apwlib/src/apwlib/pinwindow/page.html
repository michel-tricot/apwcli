<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Apple Passwords</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="icon">&#128273;</div>
  <h1>Pair Apple Passwords</h1>
  <div class="boxes">
    <input inputmode="numeric" autocomplete="one-time-code">
    <input inputmode="numeric"><input inputmode="numeric"><input inputmode="numeric">
    <input inputmode="numeric"><input inputmode="numeric">
  </div>
  <p class="hint">A verification code has been generated by your Mac.
  Enter the code to continue.</p>
  <p class="ok">&#10003; Code received &mdash; pairing&hellip;</p>
</main>
<script>
  const boxes = [...document.querySelectorAll("input")];
  const token = new URLSearchParams(location.search).get("token");
  let submitted = false;
  function submit() {
    submitted = true;
    const pin = boxes.map((b) => b.value).join("");
    fetch("/pin", { method: "POST", body: JSON.stringify({ token, pin }) })
      .then(() => document.body.classList.add("done"));
  }
  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      box.value = box.value.replace(/\D/g, "").slice(-1);
      if (box.value && i < 5) boxes[i + 1].focus();
      if (boxes.every((b) => b.value)) submit();
    });
    box.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !box.value && i > 0) boxes[i - 1].focus();
    });
    box.addEventListener("paste", (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData("text").match(/\d/g) || []).slice(0, 6);
      digits.forEach((d, j) => (boxes[j].value = d));
      if (digits.length === 6) submit();
      else boxes[digits.length].focus();
    });
  });
  addEventListener("pagehide", () => {
    // Window closed without a code: tell the caller not to wait for the timeout.
    if (!submitted) navigator.sendBeacon("/pin", JSON.stringify({ token, pin: "" }));
  });
  boxes[0].focus();
</script>
</body>
</html>
